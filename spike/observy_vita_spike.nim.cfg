# Per-file toolchain config for the PlayStation Vita networking spike (M0).
# Nim auto-discovers <module>.nim.cfg next to the source, so this applies only
# to observy_vita_spike.nim. Runtime/memory flags come from ../config.nims via
# -d:vita, matching the productized split planned for nim_vita.cfg.

--cpu:arm
--os:linux

cc = "gcc"
arm.linux.gcc.path      = "/usr/local/vitasdk/bin"
arm.linux.gcc.exe       = "arm-vita-eabi-gcc"
arm.linux.gcc.linkerexe = "arm-vita-eabi-gcc"

--passC:"-D__vita__"
--passC:"-I/usr/local/vitasdk/arm-vita-eabi/include"

# -Wl,-q is required because vita-elf-create consumes retained relocations.
--passL:"-Wl,-q"
--passL:"-L/usr/local/vitasdk/arm-vita-eabi/lib"
--passL:"-lSceNet_stub -lSceNetCtl_stub -lSceSysmodule_stub -lSceRtc_stub"
--passL:"-Wl,--start-group -lc -lm -lSceLibKernel_stub -lSceIofilemgr_stub -lSceProcessmgr_stub -Wl,--end-group"
--passL:"-Lstubs"

--path:"../src"
--path:"../../http/src"
